<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>black</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}body{position:fixed;inset:0}
</style>
</head>
<body>
<script>
(()=>{"use strict";
let taps=0,timer=null,stream=null,recorder=null,chunks=[],recording=false,starting=false,wakeLock=null;
const TYPE="video/mp4";
async function fullscreen(){try{if(!document.fullscreenElement&&document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen()}catch(_){}}
async function awake(){try{if("wakeLock"in navigator)wakeLock=await navigator.wakeLock.request("screen")}catch(_){}}
async function releaseWake(){try{if(wakeLock)await wakeLock.release()}catch(_){}wakeLock=null}
function stopCamera(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;recorder=null;recording=false;starting=false;releaseWake()}
function save(blob){try{const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="black-"+new Date().toISOString().replace(/[:.]/g,"-")+".mp4";a.style.display="none";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}catch(_){}}
async function repairMP4(blob){
 const lib=await import("https://cdn.jsdelivr.net/npm/mediabunny@1.62.1/+esm");
 const input=new lib.Input({source:new lib.BlobSource(blob),formats:lib.ALL_FORMATS});
 const target=new lib.BufferTarget();
 const output=new lib.Output({format:new lib.Mp4OutputFormat({fastStart:"in-memory"}),target});
 const conversion=await lib.Conversion.init({input,output,copy:{mode:"forced"}});
 if(!conversion.isValid||conversion.discardedTracks.length)throw new Error("MP4 remux unavailable");
 await conversion.execute();
 const data=target.buffer;
 if(!data||!data.byteLength)throw new Error("Empty repaired MP4");
 return new Blob([data],{type:TYPE});
}
async function start(){if(recording||starting)return;starting=true;try{
 if(!navigator.mediaDevices?.getUserMedia||typeof MediaRecorder==="undefined"||!MediaRecorder.isTypeSupported(TYPE))return;
 stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30,max:30}}});
 recorder=new MediaRecorder(stream,{mimeType:TYPE});chunks=[];
 recorder.addEventListener("dataavailable",e=>{if(e.data?.size)chunks.push(e.data)});
 recorder.addEventListener("stop",async()=>{
  const raw=new Blob(chunks,{type:TYPE});chunks=[];
  stopCamera();
  if(!raw.size)return;
  try{save(await repairMP4(raw))}catch(_){save(raw)}
 },{once:true});
 recorder.start();recording=true;await awake();
 }catch(_){stopCamera()}finally{starting=false}}
function stop(){if(!recording||!recorder||recorder.state==="inactive")return;try{recorder.stop()}catch(_){stopCamera()}}
function tap(){fullscreen();if(timer)clearTimeout(timer);taps++;
 if(!recording&&!starting&&taps>=2){taps=0;start();return}
 if(recording&&taps>=3){taps=0;stop();return}
 timer=setTimeout(()=>{taps=0;timer=null},550)}
document.addEventListener("pointerdown",e=>{if(e.isPrimary===false)return;e.preventDefault();tap()},{passive:false});
document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&recording)awake()});
window.addEventListener("pagehide",()=>{if(recorder&&recorder.state!=="inactive"){try{recorder.stop()}catch(_){}}stopCamera()});
})();
</script>
</body>
</html>
